<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aksis Admin Panel</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background-color: #212529; color: white; padding-top: 2rem; }
    .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 20px; transition: 0.3s; }
    .sidebar a:hover, .sidebar a.active { color: white; background-color: #343a40; border-left: 4px solid #0d6efd; }
    .main-content { padding: 2rem; }
  </style>
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      <!-- SIDEBAR -->
      <div class="col-md-2 sidebar d-none d-md-block">
        <h4 class="text-center mb-4 border-bottom pb-3">Aksis Admin</h4>
        <a href="#" class="active"><i class="bi bi-folder me-2"></i> Projeler</a>
        <a href="#" class="text-danger mt-5" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i> Çıkış Yap</a>
      </div>

      <!-- MAIN CONTENT -->
      <div class="col-md-10 main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Proje Yönetimi</h2>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProjectModal">
            <i class="bi bi-plus-lg"></i> Yeni Proje Ekle
          </button>
        </div>

        <!-- TABLO -->
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Görsel</th>
                    <th>Proje Başlığı</th>
                    <th>Durum</th>
                    <th>İşlemler</th>
                  </tr>
                </thead>
                <tbody id="projects-table-body">
                  <tr>
                    <td colspan="4" class="text-center text-muted">Yükleniyor...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Project Modal -->
  <div class="modal fade" id="addProjectModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="add-project-form">
          <div class="modal-header">
            <h5 class="modal-title">Yeni Proje Ekle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Proje Başlığı (TR)</label>
              <input type="text" class="form-control" id="proje-baslik-tr">
            </div>
            <div class="mb-3">
              <label class="form-label">Proje Başlığı (EN)</label>
              <input type="text" class="form-control" id="proje-baslik-en">
            </div>
            <div class="mb-3">
              <label class="form-label">Açıklama (TR)</label>
              <textarea class="form-control" id="proje-aciklama-tr" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Açıklama (EN)</label>
              <textarea class="form-control" id="proje-aciklama-en" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Durum</label>
              <select class="form-select" id="proje-durum" required>
                <option value="devam_ediyor">Devam Ediyor</option>
                <option value="tamamlandi">Tamamlandı</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Resim Linkleri (Çoklu Galeri İçin)</label>
              <textarea class="form-control" id="proje-gorsel" rows="3" placeholder="https://resim1.jpg&#10;https://resim2.jpg" required></textarea>
              <small class="text-muted">Birden fazla resim eklemek için her linki <b>ayrı bir satıra</b> yazın.</small>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
            <button type="submit" class="btn btn-primary" id="save-project-btn">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Project Modal -->
  <div class="modal fade" id="editProjectModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="edit-project-form">
          <div class="modal-header">
            <h5 class="modal-title">Projeyi Düzenle</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-proje-id">
            <div class="mb-3">
              <label class="form-label">Proje Başlığı (TR)</label>
              <input type="text" class="form-control" id="edit-proje-baslik-tr">
            </div>
            <div class="mb-3">
              <label class="form-label">Proje Başlığı (EN)</label>
              <input type="text" class="form-control" id="edit-proje-baslik-en">
            </div>
            <div class="mb-3">
              <label class="form-label">Açıklama (TR)</label>
              <textarea class="form-control" id="edit-proje-aciklama-tr" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Açıklama (EN)</label>
              <textarea class="form-control" id="edit-proje-aciklama-en" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Durum</label>
              <select class="form-select" id="edit-proje-durum" required>
                <option value="devam_ediyor">Devam Ediyor</option>
                <option value="tamamlandi">Tamamlandı</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Resim Linkleri</label>
              <textarea class="form-control" id="edit-proje-gorsel" rows="3" required></textarea>
              <small class="text-muted">Birden fazla resim eklemek için her linki <b>ayrı bir satıra</b> yazın.</small>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
            <button type="submit" class="btn btn-primary" id="update-project-btn">Güncelle</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  
  <script src="../js/firebase-config.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
